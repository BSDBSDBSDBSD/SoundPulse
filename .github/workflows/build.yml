name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/SoundPulse.apk
      - uses: actions/upload-artifact@v4
        with:
          name: focus-audio-apk
          path: out/SoundPulse.apk
      - name: Publish APK to a Release (direct phone download)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/crash-report'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SoundPulse — latest build
          body: "APK מתעדכן בכל בנייה. הורד את SoundPulse.apk והתקן בטלפון."
          files: out/SoundPulse.apk
          prerelease: true
